services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:5173"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - ariyo_node_modules:/workspace/node_modules
    environment:
      - CHOKIDAR_USEPOLLING
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  ariyo_node_modules:
